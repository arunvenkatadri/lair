[workspace]
resolver = "2"

members = [
    # Forked Copper core crates (internal implementation)
    "crates/cu29-clock",
    "crates/cu29-intern-strs",
    "crates/cu29-reflect-derive",
    "crates/cu29-soa-derive",
    "crates/cu29-base-derive",
    "crates/cu29-value",
    "crates/cu29-traits",
    "crates/cu29-unifiedlog",
    "crates/cu29-log",
    "crates/cu29-log-derive",
    "crates/cu29-log-runtime",
    "crates/cu29-runtime",
    "crates/cu29-helpers",
    "crates/cu29-derive",
    "crates/cu29-units",
    "crates/lair",
    "crates/lair-derive",

    # LAIR public API crates
    "crates/lair-core",
    "crates/lair-msgs",
    "crates/lair-biscuit",
    "crates/lair-bagel",
    "crates/lair-cli",
    "crates/lair-isaac",

    # Examples
    "examples/simple_robot",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Extelligence <team@extelligence.ai>"]
repository = "https://github.com/Extelligence-ai/lair"
homepage = "https://lair.dev"
keywords = ["robotics", "middleware", "safety", "deterministic", "autonomous"]
categories = ["science::robotics", "embedded", "aerospace::drones"]
rust-version = "1.75"

[workspace.dependencies]
# ── Internal crates (forked from Copper) ──
cu29 = { path = "crates/lair", version = "0.1.0" }
cu29-clock = { path = "crates/cu29-clock", default-features = false, version = "0.1.0" }
cu29-intern-strs = { path = "crates/cu29-intern-strs", version = "0.1.0" }
cu29-reflect-derive = { path = "crates/cu29-reflect-derive", version = "0.1.0" }
cu29-soa-derive = { path = "crates/cu29-soa-derive", version = "0.1.0" }
cu29-base-derive = { path = "crates/cu29-base-derive", version = "0.1.0" }
cu29-value = { path = "crates/cu29-value", default-features = false, version = "0.1.0" }
cu29-traits = { path = "crates/cu29-traits", default-features = false, version = "0.1.0" }
cu29-unifiedlog = { path = "crates/cu29-unifiedlog", default-features = false, features = ["compact", "mcap"], version = "0.1.0" }
cu29-log = { path = "crates/cu29-log", default-features = false, version = "0.1.0" }
cu29-log-derive = { path = "crates/cu29-log-derive", default-features = false, version = "0.1.0" }
cu29-log-runtime = { path = "crates/cu29-log-runtime", default-features = false, version = "0.1.0" }
cu29-runtime = { path = "crates/cu29-runtime", default-features = false, version = "0.1.0" }
cu29-helpers = { path = "crates/cu29-helpers", version = "0.1.0" }
cu29-derive = { path = "crates/cu29-derive", default-features = false, version = "0.1.0" }
cu29-units = { path = "crates/cu29-units", version = "0.1.0" }

# ── LAIR public API crates ──
lair-core = { path = "crates/lair-core", version = "0.1.0" }
lair-msgs = { path = "crates/lair-msgs", version = "0.1.0" }
lair-biscuit = { path = "crates/lair-biscuit", version = "0.1.0" }
lair-bagel = { path = "crates/lair-bagel", version = "0.1.0" }
lair-cli = { path = "crates/lair-cli", version = "0.1.0" }
lair-isaac = { path = "crates/lair-isaac", version = "0.1.0" }
lair-derive = { path = "crates/lair-derive", version = "0.1.0" }

# ── Serialization ──
bincode = { version = "2.0", default-features = false, features = ["derive", "alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false }
serde_derive = { version = "1.0", features = ["default"] }
erased-serde = { version = "0.4", default-features = false, features = ["alloc"] }
ron = { version = "0.12", default-features = false }

# ── CLI ──
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }

# ── Proc macros ──
proc-macro2 = { version = "1.0", default-features = false }
quote = { version = "1.0", default-features = false }
syn = { version = "2.0", default-features = false, features = ["full"] }

# ── Error handling ──
anyhow = { version = "1.0", default-features = false }

# ── Logging ──
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
log = { version = "0.4", default-features = false }
simplelog = "0.12"

# ── Units / Math ──
uom = { version = "0.38", default-features = false, features = ["autoconvert", "f32", "f64", "serde", "si"] }

# ── String / Container types ──
compact_str = { version = "0.9", default-features = false, features = ["serde"] }
smallvec = { version = "1.15", default-features = false, features = ["serde"] }
arrayvec = { version = "0.7", default-features = false }
heapless = { version = "0.9", default-features = false, features = ["serde"] }
hashbrown = { version = "0.16", features = ["serde"] }

# ── Graph / Config ──
petgraph = { version = "0.8", default-features = false }
paste = { version = "1.0", default-features = false }

# ── Reflection (optional) ──
bevy_reflect = { version = "0.18.0", default-features = false, features = ["auto_register_static"] }

# ── Concurrency / Sync ──
spin = { version = "0.10" }
rayon = "1.11"
ctrlc = "3.5"

# ── System ──
strfmt = "0.2"

# ── IPC / Networking (optional) ──
zenoh = { version = "1.7.0", default-features = false }
minicbor-serde = { version = "0.6.2", default-features = false }

# ── Baremetal (optional) ──
defmt = { version = "1.0", default-features = false }
rtsan-standalone = { version = "0.3.0", default-features = false }
cortex-m = "0.7"

# ── Logging (MCAP) ──
mcap = { version = "0.24", default-features = false, features = ["lz4", "zstd"] }

# ── Testing ──
tempfile = { version = "3.23", default-features = false }

# ── LAIR-specific future deps ──
thiserror = "1.0"
tokio = { version = "1.0", features = ["full", "rt-multi-thread", "sync", "time", "macros"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1  # Faster debug builds

[profile.bench]
lto = true
